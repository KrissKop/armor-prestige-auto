<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo-container">
        <img src="images/ChatGPT Image 12 juin 2026, 18_21_30.png"alt="Logo Garage Auto">
        <h1>Armor Prestige Auto</h1>
    </div>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="voitures.html">Nos véhicules</a>
        <a href="garage.html">Le garage</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="page">

    <h2>Contactez-nous</h2>

    <div class="contact-card">
        <p><strong>Armor Prestige Auto</strong></p>
        <p>15 Rue des Menhirs</p>
        <p>29000 Quimper</p>
        <p>Téléphone : 02 98 12 34 56</p>
        <p>Email : contact@armorprestigeauto.fr</p>
    </div>

    <h2>Prise de coordonnées client</h2>

    <form id="contactForm">

        <div class="form-group">
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>
        </div>

        <div class="form-group">
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
        </div>

        <div class="form-group">
            <label for="telephone">Numéro de téléphone</label>
            <input type="tel" id="telephone" name="telephone" placeholder="06 12 34 56 78" required>
        </div>

        <div class="form-group">
            <label for="email">Adresse mail</label>
            <input type="email" id="email" name="email" placeholder="exemple@email.com" required>
        </div>

        <div class="form-group">
            <label for="vehicule">Véhicule recherché</label>
            <select id="vehicule" name="vehicule">
                <option value="">Choisir un véhicule</option>
                <option value="BMW Série 5">BMW Série 5</option>
                <option value="Audi A4">Audi A4</option>
                <option value="Mercedes Classe C">Mercedes Classe C</option>
                <option value="Peugeot 508 GT">Peugeot 508 GT</option>
                <option value="Autre">Autre</option>
            </select>
        </div>

        <div class="form-group">
            <label for="budget">Budget approximatif</label>
            <input type="number" id="budget" name="budget" placeholder="Exemple : 25000">
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="rappel" name="rappel">
            <label for="rappel">Je souhaite être rappelé par le garage</label>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Votre demande..."></textarea>
        </div>

        <button type="submit">Envoyer ma demande</button>

    </form>

</section>

<footer>
    <p>© 2026 Armor Prestige Auto</p>
</footer>

<script src="script.js"></script>
</body>
</html>
